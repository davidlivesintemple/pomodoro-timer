<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄钟</title>
<style>
  :root{
    --bg:#ffffff; --fg:#37352f; --muted:#9b9a97; --track:#eeedeb;
    --focus:#e5484d; --break:#2f9e6e; --long:#3a7bd5; --free:#8b5cf6;
  }
  :root{
    --glass:rgba(0,0,0,.13); --glass-fill:rgba(0,0,0,.018); --glass-hi:rgba(255,255,255,.6);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191919; --fg:#e8e8e6; --muted:#8a8a86; --track:#2e2e2e;
      --glass:rgba(255,255,255,.15); --glass-fill:rgba(255,255,255,.03); --glass-hi:rgba(255,255,255,.1);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  /* 整个番茄钟就是一只瓶子:界面在瓶子里,完成的时段掉进来沉在瓶底 */
  .bottle{
    position:fixed; pointer-events:none; z-index:0;
    border:1.5px solid var(--glass); border-top:0;
    border-radius:3px 3px 22px 22px / 3px 3px 30px 30px;
    background:var(--glass-fill);
  }
  .bottle::after{                       /* 瓶壁高光 */
    content:''; position:absolute; left:9%; top:6%; width:2px; height:46%;
    border-radius:2px; background:var(--glass-hi); opacity:.5;
  }
  .bottle.thud{ animation:thud .16s }
  @keyframes thud{ 0%{transform:translateY(0)} 35%{transform:translateY(2px)} 100%{transform:translateY(0)} }
  #jar{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden }
  .card{ text-align:center; padding:20px 16px; user-select:none; transform-origin:center; position:relative; z-index:1 }
  .tabs{ display:inline-flex; gap:4px; background:var(--track); border-radius:999px; padding:4px; margin-bottom:14px }
  .tabs button{
    border:0; background:transparent; color:var(--muted); font-size:13px;
    padding:5px 14px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .tabs button.on{ background:var(--bg); color:var(--fg); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12) }
  /* 循环之外的额外时段,单独一排放在循环上方,不占循环的位置 */
  .extra{
    display:flex; gap:5px; justify-content:center; min-height:14px;
    margin-bottom:4px; font-size:11px; line-height:1.2; opacity:.45;
  }
  .extra i{ font-style:normal }
  /* 本轮循环进度:25-5-25-5-25-5-25-20 */
  .strip{ display:flex; gap:7px; justify-content:center; margin-bottom:16px; font-size:15px; line-height:1.6 }
  .strip i{ font-style:normal; opacity:.2; transition:all .2s; position:relative; cursor:pointer }
  .strip i.done{ opacity:1 }
  .strip i.cur{ opacity:1; transform:scale(1.3) }
  .strip i.cur::after{
    content:''; position:absolute; left:1px; right:1px; bottom:-4px; height:3px;
    border-radius:2px; background:var(--accent,var(--focus));
  }
  .ring{ position:relative; width:230px; height:230px; margin:0 auto 18px }
  .ring svg{ transform:rotate(-90deg) }
  .ring circle{ fill:none; stroke-width:8; stroke-linecap:round }
  .ring .track{ stroke:var(--track) }
  .ring .bar{ stroke:var(--accent,var(--focus)); transition:stroke-dashoffset .3s linear, stroke .3s }
  .time{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .time b{ font-size:52px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:1px; cursor:pointer }
  .time span{ font-size:13px; color:var(--muted); margin-top:2px }
  #clock-in{
    font-family:inherit; font-size:52px; font-weight:600; font-variant-numeric:tabular-nums;
    letter-spacing:1px; width:186px; text-align:center; background:var(--track); color:var(--fg);
    border:0; border-radius:14px; outline:none;
    caret-color:var(--accent,var(--focus));
    box-shadow:inset 0 0 0 2px var(--accent,var(--focus));
  }
  .btns{ display:flex; gap:10px; justify-content:center }
  .btns button{ font-family:inherit; font-size:15px; border-radius:10px; cursor:pointer; padding:10px 0 }
  #main{
    width:150px; border:0; color:#fff; background:var(--accent,var(--focus));
    font-weight:600; letter-spacing:4px; box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  #main:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18) }
  #reset{ width:64px; border:1.5px solid var(--track); background:transparent; color:var(--muted) }
  #log{
    position:fixed; right:10px; bottom:8px; font-size:11px; line-height:1.4;
    color:var(--muted); opacity:.55; letter-spacing:1px; text-align:right; cursor:pointer;
    min-width:24px; min-height:14px;
  }
  #dot{
    position:fixed; left:10px; bottom:11px; width:7px; height:7px; border-radius:50%;
    background:var(--track); transition:background .3s;
  }
  #dot.ok{ background:var(--break) }
  #dot.busy{ background:var(--muted) }
  #dot.err{ background:var(--focus) }
  /* 瓶里的东西:四层各管一条曲线(定位 / 下落弹跳 / 落地滚动 / 落地压扁) */
  .it{ position:absolute; left:0; top:0; width:var(--d); height:var(--d);
       transform:translate3d(var(--x),var(--y),0);
       transition:transform .3s cubic-bezier(.2,.7,.3,1) }
  #jar.init .it{ transition:none }
  .it u,.it b{ display:block; width:100%; height:100%; font-style:normal }
  .it s{                                            /* 装 emoji 的那一层 */
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; text-decoration:none;
    font-size:calc(var(--d) * 0.95); line-height:1; transform-origin:50% 100%;
  }
  .it.drop u{ animation:jy var(--t) both }
  .it.drop b{ animation:jx var(--t) both }
  .it.drop s{ animation:jq var(--t) both }
  @keyframes jy{                                   /* 掉下来 + 弹两下 */
    0%  { transform:translateY(var(--dy)); animation-timing-function:cubic-bezier(.4,0,.85,.5) }
    58% { transform:translateY(0);         animation-timing-function:cubic-bezier(.05,.7,.3,1) }
    74% { transform:translateY(calc(-1*var(--b1))); animation-timing-function:cubic-bezier(.6,0,.9,.45) }
    88% { transform:translateY(0);         animation-timing-function:cubic-bezier(.05,.7,.3,1) }
    95% { transform:translateY(calc(-.3*var(--b1))) }
    100%{ transform:translateY(0) }
  }
  @keyframes jx{                                   /* 落地之后才滚,不是斜着飞 */
    0%,58%{ transform:translateX(var(--dx)) rotate(0deg);
            animation-timing-function:cubic-bezier(.15,.75,.35,1) }
    100%  { transform:translateX(0) rotate(var(--rot)) }
  }
  @keyframes jq{ 0%,56%{transform:scaleY(1)} 63%{transform:scaleY(.9)} 72%{transform:scaleY(1)} 100%{transform:scaleY(1)} }
  @media (prefers-reduced-motion: reduce){
    .it.drop u,.it.drop b,.it.drop svg{ animation:none }
    .it{ transition:none }
  }
  #hist{
    display:none; position:fixed; right:8px; bottom:30px; background:var(--bg);
    border:1px solid var(--track); border-radius:8px; padding:8px 12px;
    font-size:12px; line-height:1.7; color:var(--muted); text-align:left;
    max-height:190px; overflow:auto; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index:9;
  }
  #hist .row{ white-space:nowrap }
  #hist .x{
    display:inline-block; margin-left:8px; padding:0 4px; font-weight:400;
    opacity:.35; cursor:pointer;
  }
  #hist .x:hover{ opacity:1; color:var(--focus) }
</style>
</head>
<body>
<div class="bottle" id="bottle"></div>
<div id="jar"></div>
<div class="card">
  <div class="tabs">
    <button id="t-focus" class="on">🍅 专注</button>
    <button id="t-short">☕ 短休</button>
    <button id="t-long">🛋 长休</button>
    <button id="t-free">⏳ 自由</button>
  </div>
  <div class="extra" id="extra" title="循环之外额外完成的时段"></div>
  <div class="strip" id="strip" title="本轮进度:25-5-25-5-25-5-25-20,点击可设置当前位置"></div>
  <div class="ring">
    <svg width="230" height="230" viewBox="0 0 230 230">
      <circle class="track" cx="115" cy="115" r="106"></circle>
      <circle class="bar" id="bar" cx="115" cy="115" r="106"></circle>
    </svg>
    <div class="time"><b id="clock" title="点击修改剩余时间">25:00</b><span id="hint">保持专注</span></div>
  </div>
  <div class="btns">
    <button id="main">开始</button>
    <button id="reset" title="重置">↺</button>
  </div>
</div>
<div id="log" title="点击查看一年内记录"></div>
<div id="hist"></div>
<div id="dot" title="同步状态"></div>
<script>
(function(){
  var MODES = {
    focus:{sec:25*60, label:'保持专注', color:'var(--focus)', icon:'🍅'},
    short:{sec: 5*60, label:'休息一下', color:'var(--break)', icon:'☕'},
    long :{sec:20*60, label:'好好休息', color:'var(--long)', icon:'🛋'},
    // 自由计时:时长由你定,点圆圈里的时间改。它不参与 25-5 的循环。
    free :{sec:15*60, label:'自由计时 · 点时间改', color:'var(--free)', icon:'⏳'}
  };
  try{
    var fs0 = +localStorage.getItem('pomo-free');
    if(fs0 > 0) MODES.free.sec = fs0;
  }catch(e){}
  var SEQ = ['focus','short','focus','short','focus','short','focus','long'];
  var C = 2*Math.PI*106;
  var bar = document.getElementById('bar');
  bar.style.strokeDasharray = C;
  var mode='focus', remaining=MODES.focus.sec, running=false, endAt=0, timer=null, editing=false;
  var clockEl = document.getElementById('clock');

  // 每日记录,按北京时间(UTC+8)零点切换新的一天,历史保存 365 天
  function today(){ return new Date(Date.now()+8*3600e3).toISOString().slice(0,10) }
  var store={}, log, curDay=today();
  function blank(){ return {seq:[], ex:[], o:'', rounds:0, f:0, s:0, l:0, x:0, u:0} }
  (function(){
    try{ store = JSON.parse(localStorage.getItem('pomo-hist')) || {} }catch(e){ store={} }
    try{ // 迁移旧的单日格式
      var o = JSON.parse(localStorage.getItem('pomo-log'));
      if(o && o.d===curDay && !store[curDay]){
        var f=o.seq.filter(function(i){return i==='🍅'}).length;
        var s=o.seq.filter(function(i){return i==='☕'}).length;
        store[curDay]={seq:o.seq, rounds:o.rounds, f:o.rounds*4+f, s:o.rounds*3+s, l:o.rounds, u:Date.now()};
      }
      localStorage.removeItem('pomo-log');
    }catch(e){}
    prune();
    log = useDay(curDay);
  })();
  // 取某天的可用记录;墓碑(已删除)当成空记录
  function useDay(d){
    if(!store[d] || store[d].del) store[d] = blank();
    return store[d];
  }
  function prune(){   // 只留最近 365 天
    var cutoff = new Date(Date.now()+8*3600e3-365*86400e3).toISOString().slice(0,10);
    for(var k in store){ if(k<cutoff) delete store[k] }
  }
  function persistLocal(){
    try{ localStorage.setItem('pomo-hist', JSON.stringify(store)) }catch(e){}
  }
  function save(){
    if(log) log.u = Date.now();
    persistLocal();
    schedulePush();
  }

  // ── 断点续跑 ──────────────────────────────────────────────
  // 把"现在在哪个模式、几点结束"存下来(本地 + 云端)。
  // 意外退出后重开,直接从剩下的时间接着跑。
  var restoring = false;
  function saveRun(){
    if(restoring) return;
    store._run = {
      mode: mode,
      endAt: running ? endAt : 0,
      remaining: remaining,
      running: running,
      freeSec: MODES.free.sec,
      u: Date.now()
    };
    persistLocal();
    schedulePush();
  }
  function applyRun(r){
    if(!r || typeof r!=='object' || !MODES[r.mode]) return;
    restoring = true;
    if(r.freeSec > 0) MODES.free.sec = r.freeSec;
    mode = r.mode;
    var left = r.running ? Math.round((r.endAt - Date.now())/1000) : (r.remaining|0);
    if(r.running && left > 0){
      remaining = left;
      restoring = false;
      startTimer();                 // 接着跑,不重头开始
      return;
    }
    if(r.running){                  // 人不在的时候跑完了,不替你计数
      remaining = 0; running = false;
      flash('上次计时已结束');
    }else{
      remaining = left > 0 ? left : MODES[mode].sec;
    }
    restoring = false;
    render();
  }
  function checkDay(){
    if(curDay!==today()){ curDay=today(); log = useDay(curDay); save() }
  }

  // ── 云端同步 ────────────────────────────────────────────────
  // 同步码从网址取(?k=...),不写在代码里。没有它就退回纯本地模式。
  // iPhone 的 Notion 里第三方页面的本地存储退出 app 就没,所以每次开页都先拉云端。
  var API = 'https://pomodoro-sync.pomodoro-worker.workers.dev';
  var KEY = (location.search.match(/[?&]k=([A-Za-z0-9_-]{16,64})/) || [])[1] || '';
  var dot = document.getElementById('dot');
  function setDot(c){ dot.className = c || '' }
  function endpoint(){ return API + '/d/' + KEY }

  // 逐日取较新的一份;某天只存在于一边就直接保留
  function merge(remote){
    var changed = false, runChanged = false;
    for(var d in remote){
      var r = remote[d];
      if(!r || typeof r!=='object') continue;
      if(d === '_run'){                          // 计时状态也按"谁更新用谁"
        if(!store._run || (r.u||0) > (store._run.u||0)){ store._run = r; runChanged = true; }
        continue;
      }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
      var l = store[d];
      if(!l || (r.u||0) > (l.u||0)){ store[d] = r; changed = true; }
    }
    return { changed: changed, runChanged: runChanged };
  }

  var pushT=null, pushing=false, pushAgain=false;
  function schedulePush(){
    if(!KEY) return;
    clearTimeout(pushT);
    pushT = setTimeout(push, 1200);   // 合并连续改动,少发请求
  }
  function push(){
    if(!KEY) return;
    if(pushing){ pushAgain = true; return }
    pushing = true; setDot('busy');
    fetch(endpoint(), {
      method:'PUT', credentials:'omit',
      headers:{'content-type':'application/json'},
      body: JSON.stringify(store)
    }).then(function(r){
      setDot(r.ok ? 'ok' : 'err');
    }).catch(function(){ setDot('err') })
      .then(function(){
        pushing = false;
        if(pushAgain){ pushAgain=false; schedulePush() }
      });
  }
  function pull(){
    if(!KEY){ setDot(''); return }
    setDot('busy');
    fetch(endpoint(), { credentials:'omit', cache:'no-store' })
      .then(function(r){ if(!r.ok) throw 0; return r.json() })
      .then(function(remote){
        var res = merge(remote);
        prune();
        log = useDay(curDay);
        persistLocal();
        setDot('ok');
        render();
        if(res.runChanged) applyRun(store._run);   // 接上另一台/上次没跑完的计时
        if(res.changed) push();   // 把合并结果写回,让两端一致
      })
      .catch(function(){ setDot('err') });
  }
  // 回到前台时重新拉一次(手机切回来、电脑换标签页)
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) pull();
  });

  function cnt(a,c){ return a.filter(function(x){return x===c}).length }
  function addOrder(k){
    if(typeof log.o !== 'string') log.o = '';
    if(log.o.length < 80) log.o += k;
  }

  // ── 瓶子 ────────────────────────────────────────────────────
  // 整个页面就是一只瓶子,完成的时段掉进来沉在瓶底。
  // 位置由"日期种子"确定性算出:同一天刷新多少次,堆出来都一样。
  // 全靠 CSS 动画,静止时不跑任何循环,手机不发烫。
  var Jar = (function(){
    var jarEl, bottleEl, shown = '', box = null;
    var KINDS = { f:'🍅', s:'☕', l:'🛋', x:'⏳' };
    var SIZE  = { f:1.00, s:0.66, l:0.86, x:0.74 };   // 25 分钟本来就比 5 分钟"重"
    var CAP = 40;

    function hash(s){
      var h = 2166136261;
      for(var i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
      return h >>> 0;
    }
    function rng(a){
      return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a>>>15, 1|a);
        t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
        return ((t ^ t>>>14) >>> 0) / 4294967296;
      };
    }
    // 没有顺序记录时(老数据/云端只回了计数),用固定交错法补一个
    function orderFrom(d){
      var f=d.f|0, s=d.s|0, l=d.l|0, x=d.x|0, o='', n=0;
      while(f||s||l||x){
        n++;
        if(f){ o+='f'; f--; }
        if(s){ o+='s'; s--; }
        if(l && n%3===0){ o+='l'; l--; }
        if(x && n%4===0){ o+='x'; x--; }
        if(!f && !s){ while(l-->0) o+='l'; while(x-->0) o+='x'; break; }
      }
      return o;
    }
    // 计数才是真的;把顺序串裁剪/补齐到与计数一致
    function normalize(d){
      var want={f:d.f|0,s:d.s|0,l:d.l|0,x:d.x|0}, got={f:0,s:0,l:0,x:0}, o='', i, k;
      var src = typeof d.o === 'string' ? d.o : '';
      for(i=0;i<src.length;i++){ k=src.charAt(i); if(want[k]!==undefined && got[k]<want[k]){ o+=k; got[k]++; } }
      var rest = {f:want.f-got.f, s:want.s-got.s, l:want.l-got.l, x:want.x-got.x};
      if(rest.f||rest.s||rest.l||rest.x) o += orderFrom(rest);
      return o;
    }

    function layout(){
      if(!jarEl) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var card = document.querySelector('.card');
      var cw = card ? card.getBoundingClientRect().width : 320;
      var W = Math.max(280, Math.min(vw - 12, Math.max(cw + 130, vw*0.56)));
      var H = Math.max(120, vh - 8);
      var pad = 12;
      box = {
        left: Math.round((vw - W)/2), top: 4, W: W, H: H,
        iw: W - pad*2, pad: pad,
        floor: 4 + H - 3                       // 瓶底内沿(距视口顶部)
      };
      box.d = Math.max(22, Math.min(56, Math.round(box.iw/15)));
      bottleEl.style.left = box.left+'px';
      bottleEl.style.top = box.top+'px';
      bottleEl.style.width = W+'px';
      bottleEl.style.height = H+'px';
    }

    // 圆落在高度图上:圆心高度 = max(地形高 + √(r²-dx²))
    function place(hmap, res, cx, r, iw){
      var y = r, i, bx, dx, lift;
      var i0 = Math.max(0, Math.floor((cx-r)/res)), i1 = Math.min(hmap.length-1, Math.ceil((cx+r)/res));
      for(i=i0;i<=i1;i++){
        bx = (i+0.5)*res; dx = bx - cx;
        if(Math.abs(dx) >= r) continue;
        lift = Math.sqrt(r*r - dx*dx);
        if(hmap[i] + lift > y) y = hmap[i] + lift;
      }
      return y;
    }
    function settle(hmap, res, cx, cy, r){
      var i, bx, dx, lift;
      var i0 = Math.max(0, Math.floor((cx-r)/res)), i1 = Math.min(hmap.length-1, Math.ceil((cx+r)/res));
      for(i=i0;i<=i1;i++){
        bx = (i+0.5)*res; dx = bx - cx;
        if(Math.abs(dx) >= r) continue;
        lift = Math.sqrt(r*r - dx*dx);
        if(cy + lift > hmap[i]) hmap[i] = cy + lift;
      }
    }

    // 返回每个物体的 {k, x, y, d}(x,y 是视口坐标下的左上角)
    function solve(o, dayKey){
      if(!box) return [];
      var rnd = rng(hash(dayKey));
      var res = Math.max(1.5, box.d/12);      // 高度图精度:越细,堆叠越贴合
      var n = Math.ceil(box.iw/res);
      var hmap = new Array(n), i;
      for(i=0;i<n;i++) hmap[i] = 0;
      var out = [];
      for(i=0;i<o.length && i<CAP;i++){
        var k = o.charAt(i);
        var d = box.d * (SIZE[k] || 1), r = d/2;
        var bestX = 0, bestY = 1e9, c;
        for(c=0;c<3;c++){                       // 试三个落点,挑最低的那个 → 自然填谷
          var cx = r + rnd()*(box.iw - d);
          var cy = place(hmap, res, cx, r, box.iw);
          if(cy < bestY){ bestY = cy; bestX = cx; }
        }
        settle(hmap, res, bestX, bestY, r);
        out.push({
          k: k, d: d,
          x: box.left + box.pad + bestX - r,
          y: box.floor - bestY - r
        });
      }
      return out;
    }

    function el(it){
      var e = document.createElement('i');
      e.className = 'it';
      e.setAttribute('data-k', it.k);
      e.style.setProperty('--d', it.d+'px');
      e.style.setProperty('--x', it.x+'px');
      e.style.setProperty('--y', it.y+'px');
      e.innerHTML = '<u><b><s>'+KINDS[it.k]+'</s></b></u>';
      return e;
    }
    function animate(e, it){
      var r = it.d/2;
      var dx = (Math.random()*2-1) * Math.min(70, r*2.6);
      var rot = (-dx)/r * (180/Math.PI) * 0.85;
      e.style.setProperty('--dy', (-(it.y + it.d + 40))+'px');
      e.style.setProperty('--dx', dx+'px');
      e.style.setProperty('--rot', rot.toFixed(1)+'deg');
      e.style.setProperty('--b1', Math.round(r*1.5)+'px');
      e.style.setProperty('--t', '1.05s');
      e.classList.add('drop');
      if(bottleEl){
        setTimeout(function(){
          bottleEl.classList.add('thud');
          setTimeout(function(){ bottleEl.classList.remove('thud') }, 170);
        }, 600);
      }
    }

    function paint(o, dayKey, fromIdx){
      var items = solve(o, dayKey), kids = jarEl.children, i, e;
      jarEl.classList.add('init');                       // 重排时不滑动
      while(kids.length > items.length) jarEl.removeChild(kids[kids.length-1]);
      for(i=0;i<items.length;i++){
        if(i < kids.length){
          e = kids[i];
          e.setAttribute('data-k', items[i].k);
          e.querySelector('s').textContent = KINDS[items[i].k];
        }else{
          e = el(items[i]);
          jarEl.appendChild(e);
          if(fromIdx !== null && i >= fromIdx) animate(e, items[i]);
        }
        e.style.setProperty('--d', items[i].d+'px');
        e.style.setProperty('--x', items[i].x+'px');
        e.style.setProperty('--y', items[i].y+'px');
      }
      if(window.requestAnimationFrame)
        requestAnimationFrame(function(){ jarEl.classList.remove('init') });
      else jarEl.classList.remove('init');
    }

    return {
      _day: '',
      mount: function(){
        jarEl = document.getElementById('jar');
        bottleEl = document.getElementById('bottle');
        layout();
      },
      relayout: function(){ layout(); if(shown) paint(shown, this._day, null) },
      sync: function(day, dayKey){
        if(!jarEl) return;
        var o = normalize(day || {});
        var sameDay = (this._day === dayKey);
        if(sameDay && o === shown) return;
        var from = (sameDay && o.length > shown.length && o.indexOf(shown) === 0) ? shown.length : null;
        this._day = dayKey;
        shown = o;
        paint(o, dayKey, from);
      }
    };
  })();
  // 计时进行中误点保护:需在 3 秒内再点一次才生效
  var flashMsg=null, flashT=null, pendKey=null, pendAt=0;
  function flash(m){
    flashMsg=m; clearTimeout(flashT);
    flashT=setTimeout(function(){ flashMsg=null; render() }, 2500);
    render();
  }
  function guard(key, fn){
    if(!running){ fn(); return }
    var now=Date.now();
    if(pendKey===key && now-pendAt<3000){ pendKey=null; flashMsg=null; fn(); }
    else{ pendKey=key; pendAt=now; flash('计时中,再点一次确认') }
  }
  // 点击进度条某一格 → 把本轮位置设到那里(它之前的算已完成,计入今日记录)
  function setPos(i){
    checkDay();
    var oF=cnt(log.seq,'🍅'), oS=cnt(log.seq,'☕'), oL=cnt(log.seq,'🛋');
    var ns=[]; for(var j=0;j<i;j++) ns.push(MODES[SEQ[j]].icon);
    log.seq=ns;
    log.f=(log.f||0)-oF+cnt(ns,'🍅');
    log.s=(log.s||0)-oS+cnt(ns,'☕');
    log.l=(log.l||0)-oL+cnt(ns,'🛋');
    save();
    setMode(SEQ[i]);
  }
  function renderExtra(){
    var ex = log.ex || [], h='';
    for(var i=0;i<ex.length;i++) h += '<i>'+ex[i]+'</i>';
    document.getElementById('extra').innerHTML = h;
  }
  function renderStrip(){
    var pos = Math.min(log.seq.length, SEQ.length-1);
    var el = document.getElementById('strip'), h='';
    for(var i=0;i<SEQ.length;i++){
      h += '<i class="'+(i<log.seq.length?'done':(i===pos?'cur':''))+'">'+MODES[SEQ[i]].icon+'</i>';
    }
    el.innerHTML = h;
    for(var i=0;i<el.children.length;i++){
      el.children[i].onclick = (function(idx){ return function(){ guard('p'+idx, function(){ setPos(idx) }) } })(i);
    }
  }
  // 一轮 = 做满 4 个番茄。长休是恢复,没做完不影响这一轮算数。
  function roundsOf(d){ return Math.floor((d.f||0)/4) }
  function renderLog(){
    var r = roundsOf(log);
    var s = (r>0 ? '✅×'+r+(log.seq.length?'  ':'') : '') + log.seq.join('')
          + (log.x ? '  ⏳×'+log.x : '');
    document.getElementById('log').textContent = s || '记录';
  }
  function fmt(s){ var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r }
  function render(){
    if(!editing) clockEl.textContent = fmt(remaining);
    var hintEl = document.getElementById('hint');
    hintEl.textContent = flashMsg || MODES[mode].label;
    hintEl.style.color = flashMsg ? 'var(--accent,var(--focus))' : '';
    document.documentElement.style.setProperty('--accent', MODES[mode].color);
    bar.style.stroke = MODES[mode].color;
    bar.style.strokeDashoffset = C*(1-Math.min(1, remaining/MODES[mode].sec));
    document.getElementById('main').textContent = running?'暂停':'开始';
    var tabs={focus:'t-focus',short:'t-short',long:'t-long',free:'t-free'};
    for(var k in tabs) document.getElementById(tabs[k]).className = (k===mode?'on':'');
    renderExtra();
    renderStrip();
    renderLog();
    Jar.sync(log, curDay);
  }
  function beep(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      [0,.25,.5].forEach(function(t){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value=880; g.gain.setValueAtTime(.001,ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+t+.02);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.2);
        o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.22);
      });
    }catch(e){}
  }
  function stop(){ running=false; if(timer){clearInterval(timer); timer=null} }
  function setMode(m){ stop(); mode=m; remaining=MODES[m].sec; render(); saveRun() }
  function finish(){
    stop(); beep(); checkDay();
    if(mode==='free'){                       // 自由计时只计数,不动 25-5 的循环
      log.x=(log.x||0)+1;
      if(!log.ex) log.ex = [];
      log.ex.push(MODES.free.icon);
      if(log.ex.length > 20) log.ex.shift();
      addOrder('x');
      save();
      setMode('free');
      return;
    }
    // 总数照记,不管是不是循环里的那一步
    if(mode==='focus') log.f=(log.f||0)+1; else if(mode==='short') log.s=(log.s||0)+1; else log.l=(log.l||0)+1;
    addOrder(mode==='focus'?'f':mode==='short'?'s':'l');

    // 只有走在循环上的那一步才推进进度条。
    // 额外插进来的时段(比如运动完回来先歇 5 分钟)另放一排,不打乱循环节奏。
    if(SEQ[log.seq.length] === mode){
      log.seq.push(MODES[mode].icon);
    }else{
      if(!log.ex) log.ex = [];
      log.ex.push(MODES[mode].icon);
      if(log.ex.length > 20) log.ex.shift();
    }

    if(log.seq.length >= SEQ.length) log.seq = [];   // 一整轮走完,重新开始
    save();
    setMode(SEQ[log.seq.length] || 'focus');
  }
  function tick(){
    remaining = Math.max(0, Math.round((endAt-Date.now())/1000));
    if(remaining===0) finish(); else render();
  }
  // 点击时间 → 直接输入从几分几秒开始倒计时(如 15:49 或 15)
  clockEl.onclick = function(){
    if(editing) return;
    editing=true; stop();
    var inp=document.createElement('input');
    inp.id='clock-in'; inp.value=fmt(remaining); inp.inputMode='numeric';
    clockEl.textContent=''; clockEl.appendChild(inp);
    inp.focus(); inp.select();
    function done(apply){
      if(!editing) return;
      editing=false;
      var v = inp.value;
      clockEl.removeChild(inp);
      if(apply){
        // 宽容解析:全角数字/冒号也认,12:30、12：30、12 都行
        v = v.trim()
          .replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0) })
          .replace(/[：，。．]/g, ':');
        var m = v.match(/^(\d{1,3})(?::([0-5]?\d))?$/);
        if(m){
          var s=(+m[1])*60+(+(m[2]||0));
          if(s>0){
            remaining=Math.min(s,99*60+59);
            if(mode==='free'){            // 自由模式下把新时长记住,下次直接用
              MODES.free.sec = remaining;
              try{ localStorage.setItem('pomo-free', remaining) }catch(e2){}
            }
          }
        }
        else if(v) flash('时间格式如 12:30');
      }
      render();
      saveRun();
    }
    inp.onkeydown=function(e){
      e.stopPropagation();   // 确认时间的这次回车不触发"开始"
      if(e.key==='Enter') done(true); else if(e.key==='Escape') done(false);
    };
    inp.onblur=function(){ done(true) };
  };
  function startTimer(){ running=true; endAt=Date.now()+remaining*1000; timer=setInterval(tick,250); render(); saveRun() }
  document.getElementById('main').onclick = function(){
    if(running){ stop(); render(); saveRun() }
    else{ startTimer(); }
  };
  // 任意时刻按回车开始倒计时(编辑时间时除外)
  document.addEventListener('keydown', function(e){
    if(!editing && e.key==='Enter' && !running && remaining>0) startTimer();
  });
  document.getElementById('reset').onclick = function(){ guard('reset', function(){ setMode(mode) }) };
  document.getElementById('t-focus').onclick=function(){ guard('focus', function(){ setMode('focus') }) };
  document.getElementById('t-short').onclick=function(){ guard('short', function(){ setMode('short') }) };
  document.getElementById('t-long').onclick=function(){ guard('long', function(){ setMode('long') }) };
  document.getElementById('t-free').onclick=function(){ guard('free', function(){ setMode('free') }) };
  // 点击右下角记录 → 查看一年内每日历史
  var histEl = document.getElementById('hist');
  function renderHist(){
    var days = Object.keys(store).sort().reverse(), h='';
    for(var i=0;i<days.length;i++){
      var k = days[i], d = store[k], r = roundsOf(d);
      if(d.del || !(d.f||d.s||d.l||d.x||(d.seq&&d.seq.length))) continue;
      h += '<div class="row" data-d="'+k+'">'+k.slice(5).replace('-','/')
         + '&nbsp; 🍅×'+(d.f||0)
         + (d.s ? '&nbsp; ☕×'+d.s : '')
         + (d.l ? '&nbsp; 🛋×'+d.l : '')
         + (d.x ? '&nbsp; ⏳×'+d.x : '')
         + (r ? '&nbsp; ✅×'+r : '')
         + '<b class="x" title="删除这一天">×</b></div>';
    }
    histEl.innerHTML = h || '<div>暂无记录</div>';
    var xs = histEl.querySelectorAll('.x');
    for(var j=0;j<xs.length;j++){
      xs[j].onclick = function(e){
        e.stopPropagation();
        var k = this.parentNode.getAttribute('data-d');
        if(!confirm('删除 '+k+' 的记录?')) return;
        store[k] = { del:1, u:Date.now() };   // 墓碑,让另一台设备也删掉
        if(k===curDay) log = useDay(curDay);
        try{ localStorage.setItem('pomo-hist', JSON.stringify(store)) }catch(e2){}
        schedulePush();
        renderHist(); render();
      };
    }
  }
  document.getElementById('log').onclick = function(e){
    e.stopPropagation();
    renderHist();
    histEl.style.display = histEl.style.display==='block' ? 'none' : 'block';
  };
  document.addEventListener('click', function(){ histEl.style.display='none' });
  // 整体等比缩放,实测卡片尺寸后填满可视区(留一点边距)
  var card=document.querySelector('.card');
  function fit(){
    card.style.transform='none';
    var w=card.offsetWidth, h=card.offsetHeight;
    if(!w || !h) return;
    var s=Math.min(window.innerWidth*0.92/w, window.innerHeight*0.92/h);
    card.style.transform='scale('+Math.max(0.4, Math.min(3, s))+')';
  }
  var fitT=null;
  window.addEventListener('resize', function(){
    fit();
    clearTimeout(fitT);                        // 拖动窗口时不反复重排瓶子
    fitT = setTimeout(function(){ Jar.relayout() }, 180);
  });
  Jar.mount();
  fit();
  Jar.relayout();
  setTimeout(function(){ fit(); Jar.relayout() }, 300);   // 等字体加载完再量一次
  if(store._run){
    render();
    applyRun(store._run);                // 本机上次没跑完的,先接上
  }else{
    mode = SEQ[log.seq.length] || 'focus';   // 没有计时状态,就按循环走到哪算哪
    remaining = MODES[mode].sec;
    render();
  }
  pull();                                // 再跟云端对一次
})();
</script>
</body>
</html>
